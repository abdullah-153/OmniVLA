<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniVLA Execution Signal</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="execution-shell" id="execution-shell" data-tone="idle" aria-live="polite">
      <div class="screen-edges" aria-hidden="true">
        <span class="screen-edge edge-top"></span>
        <span class="screen-edge edge-right"></span>
        <span class="screen-edge edge-bottom"></span>
        <span class="screen-edge edge-left"></span>
        <i class="edge-corner corner-nw"></i><i class="edge-corner corner-ne"></i>
        <i class="edge-corner corner-se"></i><i class="edge-corner corner-sw"></i>
      </div>

      <section class="run-beacon" id="run-beacon" aria-label="OmniVLA execution status">
        <header class="beacon-header">
          <div class="beacon-brand"><span class="mark" aria-hidden="true">△</span><span>OmniVLA</span></div>
          <span class="beacon-state" id="beacon-state">Standing by</span>
        </header>
        <div class="beacon-main">
          <p class="phase-label" id="phase-label">Preparing local control plane</p>
          <p class="action-text" id="action-text">No active run.</p>
        </div>
        <div class="signal-rail" aria-hidden="true"><span></span></div>
        <section class="trace-panel" aria-label="Actual execution trace">
          <div class="trace-heading"><span>Observed actions</span><span id="trace-count">No actions yet</span></div>
          <ol class="trace-list" id="trace-list"></ol>
        </section>
        <section class="hitl-panel" id="hitl-panel" hidden>
          <p class="hitl-question" id="hitl-question">Human input is required.</p>
          <div class="hitl-controls">
            <input id="hitl-input" maxlength="2000" placeholder="Provide a response…" />
            <button id="hitl-submit" type="button">Continue</button>
          </div>
        </section>
        <footer class="beacon-controls">
          <span id="model-label">Local execution</span>
          <div>
            <button id="pause-button" type="button">Pause</button>
            <button id="stop-button" type="button">Stop</button>
          </div>
        </footer>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
